name: Hella Image (ghcr)

# Fork-own image build (ENG-20): upstream docker.yml is gated to
# NousResearch/hermes-agent and pushes to their registry. This workflow
# builds the frozen hella branch and publishes a pinned tag to ghcr so
# tenant containers run from a reproducible image instead of a locally
# built one. amd64 only — our host (Hetzner CPX) is x86.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (pinned, e.g. hella-1.0)"
        required: true
        default: "hella-1.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=hella-amd64
          cache-to: type=gha,mode=max,scope=hella-amd64
